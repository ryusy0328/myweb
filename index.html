<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#091510">
  <title>스네이크 아케이드</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh; padding: 12px;
      display: grid; place-items: center;
      background: #091510; color: #effaf1; font: 16px/1.4 system-ui, sans-serif;
    }
    main {
      width: min(100%, 520px); padding: clamp(12px, 3vw, 22px);
      background: #122119; border: 1px solid #344d3e; border-radius: 18px;
    }
    header, .status {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    h1 { font-size: clamp(24px, 5vw, 34px); margin: 0; letter-spacing: -.05em; }
    small { color: #86dea3; font: bold 11px monospace; letter-spacing: .15em; }
    .score { color: #bdcec1; font-size: 13px; text-align: right; }
    .score strong { display: block; color: #adffb7; font: bold 28px monospace; }
    .board {
      position: relative; width: 100%;
      width: min(100%, max(180px, calc(100svh - 310px)));
      margin: 12px auto 8px; border: 1px solid #496651; border-radius: 6px;
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: auto; }
    .overlay {
      position: absolute; inset: 0; display: grid; place-content: center;
      gap: 6px; text-align: center; background: #06130bc9; pointer-events: none;
    }
    .overlay strong { font-size: clamp(22px, 5vw, 32px); }
    .overlay span, .status { font-size: 13px; color: #c1d3c5; }
    [hidden] { display: none; }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    button {
      min-height: 46px; padding: 4px; border: 1px solid #486452; border-radius: 9px;
      background: #263d2f; color: #f2fff5; font: 600 15px system-ui;
      touch-action: manipulation; user-select: none; cursor: pointer;
    }
    button:active:not(:disabled) { background: #476b53; }
    button:focus-visible { outline: 3px solid #ffbf82; outline-offset: 2px; }
    button:disabled { opacity: .45; cursor: default; }
    #start { background: #a0f2ae; color: #132719; }
    .pad {
      display: grid; grid-template-columns: repeat(3, minmax(48px, 76px));
      justify-content: center; gap: 5px; margin-top: 12px;
    }
    .pad button { min-height: 48px; font-size: 22px; }
    .up { grid-column: 2; }
    .left { grid-column: 1; }
    @media (max-height: 540px) and (min-aspect-ratio: 4/3) {
      main {
        width: min(100%, 820px); display: grid; grid-template-columns: 1fr 1fr;
        gap: 6px 16px; align-items: center;
      }
      header { grid-column: 1 / -1; }
      .board {
        grid-column: 1; grid-row: 2 / 5;
        width: min(100%, max(160px, calc(100svh - 130px))); margin: 0 auto;
      }
      .actions, .pad, .status { grid-column: 2; margin-top: 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><small>GRID ARCADE / 01</small><h1>스네이크</h1></div>
      <div class="score">현재 점수<strong id="score">0</strong></div>
    </header>

    <div class="board">
      <canvas width="600" height="600" aria-label="20×20 스네이크 게임판"></canvas>
      <div class="overlay"><strong id="title"></strong><span id="hint"></span></div>
    </div>

    <div class="status"><span id="status" role="status"></span><small>20 × 20</small></div>
    <div class="actions">
      <button id="start">게임 시작</button>
      <button id="pause">일시정지</button>
      <button id="restart">다시 시작</button>
    </div>
    <div class="pad" role="group" aria-label="이동 방향">
      <button class="up" data-dir="0" aria-label="위">▲</button>
      <button class="left" data-dir="3" aria-label="왼쪽">◀</button>
      <button data-dir="2" aria-label="아래">▼</button>
      <button data-dir="1" aria-label="오른쪽">▶</button>
    </div>
  </main>

  <script>
    'use strict';
    const $ = selector => document.querySelector(selector);
    const ctx = $('canvas').getContext('2d');
    const SIZE = 20, CELL = 30, STEP_MS = 155;
    const vectors = [[0, -1], [1, 0], [0, 1], [-1, 0]];
    const keys = ['ArrowUp', 'ArrowRight', 'ArrowDown', 'ArrowLeft'];
    const screens = {
      ready:   ['준비 완료', '게임 시작을 누르세요.'],
      running: ['플레이 중', ''],
      paused:  ['일시정지', '계속하기를 누르세요.'],
      over:    ['게임 종료', '다시 시작으로 한 판 더!'],
      won:     ['격자 완성!', '모든 칸을 채웠습니다.']
    };
    let snake, food, direction, turns, score, state, timer;

    function placeFood() {
      const used = new Set(snake.map(([x, y]) => y * SIZE + x));
      const free = [];
      for (let i = 0; i < SIZE * SIZE; i++) {
        if (!used.has(i)) free.push(i);
      }
      if (!free.length) return null;
      const cell = free[Math.floor(Math.random() * free.length)];
      return [cell % SIZE, Math.floor(cell / SIZE)];
    }

    function draw() {
      const side = SIZE * CELL;
      ctx.fillStyle = '#0b1911';
      ctx.fillRect(0, 0, side, side);
      ctx.beginPath();
      for (let i = 1; i < SIZE; i++) {
        const p = i * CELL + .5;
        ctx.moveTo(p, 0); ctx.lineTo(p, side);
        ctx.moveTo(0, p); ctx.lineTo(side, p);
      }
      ctx.strokeStyle = '#263a2c';
      ctx.stroke();

      if (food) {
        const x = food[0] * CELL + CELL / 2, y = food[1] * CELL + CELL / 2;
        ctx.fillStyle = '#ffad70';
        ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffe2b8'; ctx.fillRect(x - 4, y - 5, 4, 4);
      }

      snake.forEach(([x, y], i) => {
        ctx.fillStyle = i === 0 ? '#b0ffaf' : '#53ca79';
        ctx.fillRect(x * CELL + 2, y * CELL + 2, CELL - 4, CELL - 4);
      });
      const [x, y] = snake[0], [dx, dy] = vectors[direction];
      ctx.fillStyle = '#14291a';
      for (const s of [-1, 1]) {
        ctx.fillRect(x * CELL + 13 + 6*dx + s*6*dy,
                     y * CELL + 13 + 6*dy + s*6*dx, 4, 4);
      }
      $('#score').textContent = score;
    }

    function setState(next) {
      clearInterval(timer);
      state = next;
      turns = [];
      const [title, hint] = screens[next];
      $('.overlay').hidden = next === 'running';
      $('#title').textContent = title;
      $('#hint').textContent = hint;
      $('#status').textContent = title;
      $('#start').disabled = next !== 'ready';
      $('#pause').disabled = next !== 'running' && next !== 'paused';
      $('#pause').textContent = next === 'paused' ? '계속하기' : '일시정지';
      if (next === 'running') timer = setInterval(tick, STEP_MS);
    }

    function reset(next) {
      snake = [[9, 10], [8, 10], [7, 10]];
      direction = 1;
      score = 0;
      food = placeFood();
      setState(next);
      draw();
    }

    function requestTurn(next) {
      if (state !== 'running' || turns.length >= 2) return;
      // 예약된 마지막 방향을 기준으로 직각 회전만 허용한다.
      const previous = turns.length ? turns[turns.length - 1] : direction;
      if (Math.abs(next - previous) % 2 === 1) turns.push(next);
    }

    function tick() {
      if (state !== 'running') return;
      if (turns.length) direction = turns.shift();
      const [dx, dy] = vectors[direction];
      const x = snake[0][0] + dx, y = snake[0][1] + dy;
      const eating = x === food[0] && y === food[1];
      const wall = x < 0 || x >= SIZE || y < 0 || y >= SIZE;
      // 먹지 않는 턴에는 꼬리도 동시에 움직이므로 그 자리는 비게 된다.
      const hitBody = snake.some(([sx, sy], i) =>
        (eating || i < snake.length - 1) && x === sx && y === sy
      );
      if (wall || hitBody) {
        setState('over');
        return;
      }
      if (!eating) snake.pop();
      snake.unshift([x, y]);
      if (eating) {
        score += 10;
        food = placeFood();
        if (!food) setState('won');
      }
      draw();
    }

    $('#start').onclick = () => { if (state === 'ready') setState('running'); };
    $('#restart').onclick = () => reset('running');
    $('#pause').onclick = () => {
      if (state === 'running') setState('paused');
      else if (state === 'paused') setState('running');
    };

    window.addEventListener('keydown', event => {
      const next = keys.indexOf(event.key);
      if (next === -1 || state !== 'running') return;
      event.preventDefault();
      if (!event.repeat) requestTurn(next);
    });
    document.querySelectorAll('[data-dir]').forEach(button => {
      button.onclick = () => requestTurn(Number(button.dataset.dir));
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && state === 'running') setState('paused');
    });

    reset('ready');
  </script>
</body>
</html>
